<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0b14">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Diario de Estudio</h1>
      <p class="app__subtitle">Registra tus sesiones y mantén viva tu racha.</p>
    </header>

    <section class="streak" aria-live="polite">
      <p class="streak__label">Racha actual</p>
      <p class="streak__value">
        <span id="streak-days">0</span>
        <span class="streak__fire" aria-hidden="true">🔥</span>
      </p>
      <p class="streak__unit" id="streak-unit">días</p>
      <p class="streak__best">Mejor racha: <strong id="best-streak">0</strong> <span id="best-streak-unit">días</span></p>
    </section>

    <section class="card">
      <h2 class="card__title">Nueva sesión</h2>

      <form id="session-form" class="form">
        <div class="field">
          <label for="date">Fecha</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="field">
          <label for="topic">Tema</label>
          <input type="text" id="topic" name="topic" placeholder="Ej.: Repasar JavaScript" required>
        </div>

        <div class="field">
          <label for="minutes">Minutos</label>
          <input type="number" id="minutes" name="minutes" min="1" step="1" inputmode="numeric" placeholder="Ej.: 45" required>
        </div>

        <button type="submit" class="button">Registrar sesión</button>
      </form>
    </section>

    <section class="history">
      <h2 class="history__title">Sesiones</h2>
      <ul id="sessions-list" class="sessions"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
