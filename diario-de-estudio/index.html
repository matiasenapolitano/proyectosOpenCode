<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080807">
  <script>
    // Aplica fruta e idioma guardados antes de pintar para evitar saltos visuales.
    try {
      const savedFruit = localStorage.getItem('diario-de-estudio:fruta');
      if (savedFruit === 'lima' || savedFruit === 'manzana' || savedFruit === 'uva') {
        document.documentElement.dataset.fruit = savedFruit;
      }

      const savedLanguage = localStorage.getItem('diario-de-estudio:idioma');
      if (savedLanguage === 'es' || savedLanguage === 'en') {
        document.documentElement.lang = savedLanguage;
      }
    } catch (error) {
      // Si localStorage está bloqueado, quedan lima y español por defecto.
    }
  </script>
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="masthead__top">
        <div class="controls">
          <div class="control-group fruit-picker" role="group" aria-label="Fruta" data-i18n-aria-label="fruitGroup">
            <button type="button" class="control-button fruit-button" data-fruit-value="lima" aria-label="Lima" title="Lima" aria-pressed="true" data-i18n-aria-label="fruitLima" data-i18n-title="fruitLima">
              <svg class="fruit-swatch fruit-swatch--lima" viewBox="0 0 24 24" aria-hidden="true">
                <ellipse cx="12" cy="13.4" rx="6.2" ry="7.2" fill="currentColor"/>
                <path d="M13.5 7.2 C14.8 4.2 17.5 3.2 19.4 3.8 C18.9 6.8 16.8 8.4 14 8.4 C13.8 8 13.6 7.6 13.5 7.2 Z" fill="currentColor" fill-opacity="0.72"/>
                <path d="M13.7 7.6 C13.5 5.8 13.9 4.3 14.8 3.2" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </button>

            <button type="button" class="control-button fruit-button" data-fruit-value="manzana" aria-label="Manzana" title="Manzana" aria-pressed="false" data-i18n-aria-label="fruitManzana" data-i18n-title="fruitManzana">
              <svg class="fruit-swatch fruit-swatch--manzana" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 7.2 C11 4.6 8.1 4 6.2 5.9 C3.8 8.3 4.2 12.8 6.2 15.7 C7.4 17.5 9 18.8 10.7 18.8 C11.5 18.8 11.7 18.3 12 18.3 C12.3 18.3 12.5 18.8 13.3 18.8 C15 18.8 16.6 17.5 17.8 15.7 C19.8 12.8 20.2 8.3 17.8 5.9 C15.9 4 13 4.6 12 7.2 Z" fill="currentColor"/>
                <path d="M12 7 C12 5.2 12.7 3.8 14 2.8" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" stroke-linecap="round"/>
                <path d="M14.2 4.3 C15.4 2.4 17.4 1.8 19 2.3 C18.4 4.4 16.9 5.6 14.8 5.6 C14.5 5.2 14.3 4.8 14.2 4.3 Z" fill="currentColor" fill-opacity="0.72"/>
              </svg>
            </button>

            <button type="button" class="control-button fruit-button" data-fruit-value="uva" aria-label="Uva" title="Uva" aria-pressed="false" data-i18n-aria-label="fruitUva" data-i18n-title="fruitUva">
              <svg class="fruit-swatch fruit-swatch--uva" viewBox="0 0 24 24" aria-hidden="true">
                <g fill="currentColor" stroke="rgba(0, 0, 0, 0.35)" stroke-width="0.8">
                  <circle cx="9" cy="9.5" r="3.1"/>
                  <circle cx="15" cy="9.5" r="3.1"/>
                  <circle cx="6.8" cy="14.4" r="3.1"/>
                  <circle cx="12" cy="14.4" r="3.1"/>
                  <circle cx="17.2" cy="14.4" r="3.1"/>
                  <circle cx="9.4" cy="19" r="3.1"/>
                  <circle cx="14.6" cy="19" r="3.1"/>
                </g>
                <path d="M12 6 C12 4.5 12.5 3.3 13.5 2.4" fill="none" stroke="currentColor" stroke-opacity="0.65" stroke-width="1.2" stroke-linecap="round"/>
                <path d="M13.5 4 C15 2.3 17.2 1.9 18.8 2.5 C18 4.6 16.3 5.7 14.2 5.5 C13.9 5 13.7 4.5 13.5 4 Z" fill="currentColor" fill-opacity="0.72"/>
              </svg>
            </button>
          </div>

          <span class="controls__divider" aria-hidden="true"></span>

          <div class="control-group language-picker" role="group" aria-label="Idioma" data-i18n-aria-label="languageGroup">
            <button type="button" class="control-button language-button" data-language-value="es" lang="es" aria-label="Español" aria-pressed="true" data-i18n-aria-label="languageSpanish">ES</button>
            <button type="button" class="control-button language-button" data-language-value="en" lang="en" aria-label="Inglés" aria-pressed="false" data-i18n-aria-label="languageEnglish">EN</button>
          </div>
        </div>
      </div>

      <div class="masthead__body">
        <h1 class="masthead__title"><span data-i18n="title">Diario de Estudio</span><span class="masthead__dot" aria-hidden="true">.</span></h1>
        <p class="masthead__intro" data-i18n="intro">Registra tus sesiones y mantén viva tu racha.</p>
      </div>
    </header>

    <main>
      <div class="workspace">
        <section class="streaks" aria-labelledby="streaks-title">
          <div class="streaks__head">
            <h2 class="streaks__title" id="streaks-title" data-i18n="streaksTitle">Rachas</h2>
            <p class="streaks__hint" data-i18n="streaksHint">Elegí una categoría para registrar.</p>
          </div>

          <div class="streaks__layout">
            <div class="access-list">
              <button type="button" class="access-panel" data-category="study" aria-pressed="true" aria-controls="study-form">
                <span class="access-panel__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 5.5c2.6-.6 5.1-.1 8 1.4v11.6c-2.9-1.5-5.4-2-8-1.4z"/>
                    <path d="M20 5.5c-2.6-.6-5.1-.1-8 1.4v11.6c2.9-1.5 5.4-2 8-1.4z"/>
                  </svg>
                </span>
                <span class="access-panel__body">
                  <span class="access-panel__name" data-i18n="study">Estudio</span>
                  <span class="access-panel__best"><span data-i18n="bestShort">Mejor</span> <strong id="study-best">0</strong> <span id="study-best-unit">días</span></span>
                </span>
                <span class="access-panel__streak">
                  <span class="visually-hidden" data-i18n="streakLabel">Racha actual</span>
                  <strong class="access-panel__number" id="study-streak">0</strong>
                  <span class="access-panel__unit" id="study-streak-unit">días</span>
                </span>
              </button>

              <button type="button" class="access-panel" data-category="exercise" aria-pressed="false" aria-controls="exercise-form">
                <span class="access-panel__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7.5 8v8M4.5 9.5v5M16.5 8v8M19.5 9.5v5M7.5 12h9"/>
                  </svg>
                </span>
                <span class="access-panel__body">
                  <span class="access-panel__name" data-i18n="exercise">Ejercicio</span>
                  <span class="access-panel__best"><span data-i18n="bestShort">Mejor</span> <strong id="exercise-best">0</strong> <span id="exercise-best-unit">días</span></span>
                </span>
                <span class="access-panel__streak">
                  <span class="visually-hidden" data-i18n="streakLabel">Racha actual</span>
                  <strong class="access-panel__number" id="exercise-streak">0</strong>
                  <span class="access-panel__unit" id="exercise-streak-unit">días</span>
                </span>
              </button>

              <button type="button" class="access-panel" data-category="water" aria-pressed="false" aria-controls="water-form">
                <span class="access-panel__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3.5c3.1 3.6 5.2 6 5.2 9a5.2 5.2 0 0 1-10.4 0c0-3 2.1-5.4 5.2-9Z"/>
                    <path d="M9.2 14.2c.4 1.1 1.3 1.8 2.6 2"/>
                  </svg>
                </span>
                <span class="access-panel__body">
                  <span class="access-panel__name" data-i18n="water">Agua</span>
                  <span class="access-panel__best"><span data-i18n="bestShort">Mejor</span> <strong id="water-best">0</strong> <span id="water-best-unit">días</span></span>
                </span>
                <span class="access-panel__streak">
                  <span class="visually-hidden" data-i18n="streakLabel">Racha actual</span>
                  <strong class="access-panel__number" id="water-streak">0</strong>
                  <span class="access-panel__unit" id="water-streak-unit">días</span>
                </span>
              </button>
            </div>

            <div class="streaks__mark" aria-hidden="true">
            <svg class="fruit-mark fruit--lima" viewBox="0 0 240 240" focusable="false">
              <defs>
                <clipPath id="lime-clip">
                  <path d="M120 48 C150 48 174 78 176 120 C178 160 154 192 121 199 C119 200 117 200 115 199 C82 192 58 160 60 120 C62 78 90 48 120 48 Z"/>
                </clipPath>
              </defs>

              <circle class="fruit-ring" cx="120" cy="120" r="99"/>
              <ellipse class="fruit-glow" cx="120" cy="204" rx="62" ry="9"/>

              <path class="fruit-body" d="M120 48 C150 48 174 78 176 120 C178 160 154 192 121 199 C119 200 117 200 115 199 C82 192 58 160 60 120 C62 78 90 48 120 48 Z"/>

              <g clip-path="url(#lime-clip)">
                <path class="fruit-shade" d="M63 133 C64 166 84 190 112 195 C88 184 72 161 71 131 C70 106 79 84 97 70 C75 82 62 105 63 133 Z"/>
                <path class="fruit-highlight" d="M86 95 C77 112 75 138 80 160"/>
                <path class="fruit-shadow-line" d="M170 121 C174 145 164 169 146 184"/>
                <circle class="fruit-speck" cx="100" cy="118" r="2.2"/>
                <circle class="fruit-speck" cx="151" cy="97" r="1.8"/>
                <circle class="fruit-speck" cx="137" cy="153" r="2.4"/>
                <circle class="fruit-speck" cx="162" cy="140" r="1.5"/>
                <circle class="fruit-speck" cx="107" cy="168" r="1.7"/>
                <circle class="fruit-speck" cx="88" cy="145" r="1.3"/>
              </g>

              <path class="fruit-stem" d="M136 56 C134 47 137 39 144 33"/>
              <path class="fruit-leaf" d="M139 55 C147 36 164 27 184 29 C182 48 168 64 145 67 C141 63 139 59 139 55 Z"/>
              <path class="fruit-vein" d="M146 64 C157 52 169 43 181 38"/>
              <path class="fruit-tip" d="M117 198 C118 201 120 202 122 199"/>
              <path class="fruit-top-light" d="M92 81 C104 71 120 67 135 69"/>
            </svg>

            <svg class="fruit-mark fruit--manzana" viewBox="0 0 240 240" focusable="false">
              <defs>
                <clipPath id="apple-clip">
                  <path d="M120 80 C110 60 88 56 71 70 C52 88 56 124 72 154 C86 180 104 196 120 196 C136 196 154 180 168 154 C184 124 188 88 169 70 C152 56 130 60 120 80 Z"/>
                </clipPath>
              </defs>

              <circle class="fruit-ring" cx="120" cy="120" r="99"/>
              <ellipse class="fruit-glow" cx="120" cy="204" rx="58" ry="9"/>

              <path class="fruit-body" d="M120 80 C110 60 88 56 71 70 C52 88 56 124 72 154 C86 180 104 196 120 196 C136 196 154 180 168 154 C184 124 188 88 169 70 C152 56 130 60 120 80 Z"/>

              <g clip-path="url(#apple-clip)">
                <path class="fruit-shade" d="M154 92 C168 114 166 144 150 168 C165 150 174 124 166 100 Z"/>
                <path class="fruit-highlight" d="M92 96 C82 116 84 142 94 160"/>
                <circle class="fruit-speck" cx="151" cy="112" r="2.1"/>
                <circle class="fruit-speck" cx="139" cy="165" r="1.8"/>
                <circle class="fruit-speck" cx="105" cy="176" r="1.6"/>
                <circle class="fruit-speck" cx="88" cy="126" r="1.4"/>
                <circle class="fruit-speck" cx="161" cy="139" r="1.3"/>
              </g>

              <path class="fruit-stem" d="M120 80 C120 64 124 52 132 42"/>
              <path class="fruit-leaf" d="M130 50 C140 30 160 22 179 26 C177 46 162 60 138 62 C134 58 132 54 130 50 Z"/>
              <path class="fruit-vein" d="M138 58 C149 46 161 38 173 32"/>
              <path class="fruit-top-light" d="M90 84 C101 73 115 68 129 69"/>
            </svg>

            <svg class="fruit-mark fruit--uva" viewBox="0 0 240 240" focusable="false">
              <circle class="fruit-ring" cx="120" cy="120" r="99"/>
              <ellipse class="fruit-glow" cx="120" cy="204" rx="58" ry="9"/>

              <path class="fruit-stem" d="M120 92 C119 66 123 50 132 40"/>
              <path class="fruit-leaf" d="M132 50 C142 30 162 22 181 26 C179 46 164 60 140 62 C136 58 134 54 132 50 Z"/>
              <path class="fruit-vein" d="M140 58 C151 46 163 38 175 32"/>

              <g>
                <circle class="fruit-berry" cx="100" cy="104" r="22"/>
                <circle class="fruit-berry" cx="140" cy="104" r="22"/>
                <circle class="fruit-berry" cx="80" cy="130" r="22"/>
                <circle class="fruit-berry" cx="120" cy="130" r="22"/>
                <circle class="fruit-berry" cx="160" cy="130" r="22"/>
                <circle class="fruit-berry" cx="100" cy="156" r="22"/>
                <circle class="fruit-berry" cx="140" cy="156" r="22"/>
                <circle class="fruit-berry" cx="120" cy="180" r="21"/>
              </g>

              <g>
                <circle class="fruit-berry-light" cx="93" cy="97" r="5"/>
                <circle class="fruit-berry-light" cx="133" cy="97" r="5"/>
                <circle class="fruit-berry-light" cx="73" cy="123" r="5"/>
                <circle class="fruit-berry-light" cx="113" cy="123" r="5"/>
                <circle class="fruit-berry-light" cx="153" cy="123" r="5"/>
                <circle class="fruit-berry-light" cx="93" cy="149" r="5"/>
                <circle class="fruit-berry-light" cx="133" cy="149" r="5"/>
                <circle class="fruit-berry-light" cx="113" cy="173" r="4.5"/>
              </g>
            </svg>
            </div>
          </div>
        </section>

        <section class="card" aria-labelledby="form-title">
          <h2 class="card__title" id="form-title">Nueva sesión</h2>

          <form id="study-form" class="form" data-form-category="study" aria-labelledby="form-title">
            <div class="field">
              <label for="study-date" data-i18n="date">Fecha</label>
              <input type="date" id="study-date" name="date" required>
            </div>

            <div class="field">
              <label for="study-topic" data-i18n="topic">Tema de estudio</label>
              <input type="text" id="study-topic" name="topic" placeholder="Ej.: Repasar JavaScript" required data-i18n-placeholder="topicPlaceholder">
            </div>

            <div class="field">
              <label for="study-notes" data-i18n="notes">Notas</label>
              <textarea id="study-notes" name="notes" rows="3" placeholder="Ej.: Dudas, ideas o algo para recordar" data-i18n-placeholder="notesPlaceholder"></textarea>
            </div>

            <div class="field">
              <label for="study-minutes" data-i18n="minutes">Minutos</label>
              <input type="number" id="study-minutes" name="minutes" min="1" step="1" inputmode="numeric" placeholder="Ej.: 45" required data-i18n-placeholder="minutesPlaceholder">
            </div>

            <button type="submit" class="button" data-i18n="submit">Registrar sesión</button>
          </form>

          <form id="exercise-form" class="form" data-form-category="exercise" aria-labelledby="form-title" hidden>
            <div class="field">
              <label for="exercise-date" data-i18n="date">Fecha</label>
              <input type="date" id="exercise-date" name="date" required>
            </div>

            <div class="field">
              <label for="exercise-description" data-i18n="exerciseDescription">Descripción del ejercicio</label>
              <input type="text" id="exercise-description" name="description" placeholder="Ej.: Trote suave y elongación" required data-i18n-placeholder="exerciseDescriptionPlaceholder">
            </div>

            <div class="field">
              <label for="exercise-type" data-i18n="exerciseType">Tipo de ejercicio</label>
              <select id="exercise-type" name="type" required>
                <option value="" disabled selected data-i18n="exerciseTypePlaceholder">Seleccioná un tipo</option>
                <option value="aerobic" data-i18n="typeAerobic">Aeróbico</option>
                <option value="walking" data-i18n="typeWalking">Caminata</option>
                <option value="running" data-i18n="typeRunning">Correr</option>
                <option value="swimming" data-i18n="typeSwimming">Natación</option>
                <option value="contact" data-i18n="typeContact">Deporte de contacto</option>
                <option value="football" data-i18n="typeFootball">Fútbol</option>
                <option value="basketball" data-i18n="typeBasketball">Básquet</option>
                <option value="gym" data-i18n="typeGym">Gimnasio / musculación</option>
                <option value="yoga" data-i18n="typeYoga">Yoga / pilates</option>
                <option value="cycling" data-i18n="typeCycling">Ciclismo</option>
                <option value="functional" data-i18n="typeFunctional">Funcional / crossfit</option>
                <option value="climbing" data-i18n="typeClimbing">Escalada</option>
                <option value="racket" data-i18n="typeRacket">Tenis / pádel</option>
                <option value="dance" data-i18n="typeDance">Baile / danza</option>
                <option value="other" data-i18n="typeOther">Otro</option>
              </select>
            </div>

            <div class="field">
              <label for="exercise-duration" data-i18n="duration">Tiempo (min)</label>
              <input type="number" id="exercise-duration" name="duration" min="1" step="1" inputmode="numeric" placeholder="Ej.: 30" required data-i18n-placeholder="durationPlaceholder">
            </div>

            <div class="field">
              <label for="exercise-place" data-i18n="place">Lugar</label>
              <select id="exercise-place" name="place" required>
                <option value="" disabled selected data-i18n="placePlaceholder">Elegí un lugar</option>
                <option value="home" data-i18n="placeHome">En casa</option>
                <option value="gym" data-i18n="placeGym">Gym o club</option>
              </select>
            </div>

            <button type="submit" class="button" data-i18n="submitExercise">Registrar ejercicio</button>
          </form>

          <form id="water-form" class="form" data-form-category="water" aria-labelledby="form-title" hidden>
            <div class="field">
              <label for="water-date" data-i18n="date">Fecha</label>
              <input type="date" id="water-date" name="date" required>
            </div>

            <div class="field">
              <label for="water-amount" data-i18n="waterAmount">Agua (litros)</label>
              <input type="number" id="water-amount" name="liters" min="0.1" max="20" step="0.1" inputmode="decimal" placeholder="Ej.: 0,5" required data-i18n-placeholder="waterAmountPlaceholder">
            </div>

            <div class="water-status" aria-live="polite">
              <div class="water-status__row">
                <span class="water-status__total" id="water-status-total">0 L / 2 L</span>
                <span class="water-status__label" id="water-status-label">Faltan 2 L</span>
              </div>
              <div class="water-status__meter" id="water-meter" role="progressbar" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0" aria-label="Progreso de agua del día" data-i18n-aria-label="waterProgressLabel">
                <span class="water-status__fill" id="water-meter-fill"></span>
              </div>
            </div>

            <button type="submit" class="button" data-i18n="submitWater">Registrar agua</button>
          </form>

          <p class="form__note" id="form-note">Tus sesiones quedan guardadas en este navegador.</p>
        </section>
      </div>

      <section class="history" aria-labelledby="history-title">
        <div class="history__head">
          <h2 class="history__title" id="history-title">Sesiones</h2>
          <span class="history__rule" aria-hidden="true"></span>
        </div>
        <ul id="history-list" class="sessions"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
